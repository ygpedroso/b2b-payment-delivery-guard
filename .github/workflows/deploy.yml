name: Deploy Shopify Function & Railway Server

on:
  workflow_dispatch: # Manual trigger only (never runs on push)

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Deploy Shopify Function (Wasm) to Shopify Edge
  # -------------------------------------------------------------
  deploy-shopify-wasm:
    name: Deploy Wasm to Shopify Edge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy Function via Shopify CLI
        env:
          SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          npx shopify app deploy --allow-updates

  # -------------------------------------------------------------
  # Job 2: Build & Deploy Remix Server to Railway
  # -------------------------------------------------------------
  deploy-remix-railway:
    name: Deploy Remix Server to Railway
    needs: deploy-shopify-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach --service web

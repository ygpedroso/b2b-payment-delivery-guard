# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b2b-payment-delivery-guard-client-id"
name = "B2B Payment & Delivery Guard"
application_url = "https://b2b-payment-delivery.fastloomlabs.com"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [
    "customers/data_request",
    "customers/redact",
    "shop/redact"
  ]

[access_scopes]
scopes = "write_payment_customizations,read_payment_customizations,write_delivery_customizations,read_delivery_customizations,read_products,read_customers"

[auth]
redirect_urls = [
  "https://b2b-payment-delivery.fastloomlabs.com/api/auth",
  "https://b2b-payment-delivery.fastloomlabs.com/api/auth/callback",
  "https://b2b-payment-delivery.fastloomlabs.com/auth/callback",
  "https://b2b-payment-delivery.fastloomlabs.com/auth/shopify/callback"
]

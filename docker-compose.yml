services:
  db:
    image: postgres:16-alpine
    container_name: b2b_payment_delivery_guard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: b2b_payment_delivery_guard
    ports:
      - "5443:5432"
    volumes:
      - b2b_payment_delivery_guard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b_payment_delivery_guard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  b2b_payment_delivery_guard_postgres_data:
